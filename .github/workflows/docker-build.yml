name: Docker image build

# The image is built on the host at deploy time, so this is the only place a
# Dependabot bump gets exercised before it merges.
on:
  pull_request:

concurrency:
  group: docker-build-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build and boot image
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Build image
        run: docker build -t webhook-ingester:ci .

      # Boots gunicorn and waits for the image's own HEALTHCHECK to report healthy.
      - name: Smoke-test health endpoint
        run: |
          docker run -d --name ingester -e LOKI_URL=http://127.0.0.1:3100 webhook-ingester:ci
          for _ in $(seq 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' ingester)
            [ "$status" = healthy ] && exit 0
            sleep 2
          done
          docker logs ingester
          exit 1
